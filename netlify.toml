[build]
  command = "npm install"
  publish = "public"

[build.environment]
  # Non-sensitive values that appear throughout the code (e.g. "galleries", "production")
  SECRETS_SCAN_OMIT_KEYS = "S3_PREFIX,NODE_ENV"

[functions]
  directory = "netlify/functions"
  external_node_modules = ["express"]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true